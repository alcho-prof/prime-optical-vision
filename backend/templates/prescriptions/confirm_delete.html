{% extends 'base.html' %}

{% block content %}
<div class="container" style="padding: 40px 20px; max-width: 600px; text-align: center;">
    <div style="background: #ffebee; padding: 40px; border-radius: 8px; border: 1px solid #ef9a9a;">
        <h2 style="color: #c62828;">Delete Prescription?</h2>
        <p>Are you sure you want to delete <strong>{{ prescription.name }}</strong>?</p>
        <p>This action cannot be undone.</p>

        <form method="post" style="margin-top: 30px; display: flex; justify-content: center; gap: 20px;">
            {% csrf_token %}
            <button type="submit"
                style="background: #c62828; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer;">Yes,
                Delete</button>
            <a href="{% url 'prescriptions:list' %}"
                style="padding: 10px 20px; text-decoration: none; color: #555; background: #fff; border: 1px solid #ccc; border-radius: 4px;">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
