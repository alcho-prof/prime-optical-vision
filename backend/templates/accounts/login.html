{% extends 'base.html' %}

{% block content %}
<div class="container"
    style="max-width: 400px; margin: 60px auto; padding: 30px; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    <h2 style="text-align: center; margin-bottom: 30px;">Login</h2>

    <form method="post">
        {% csrf_token %}

        {% if form.errors %}
        <div style="background-color: #ffebee; color: #c62828; padding: 10px; border-radius: 4px; margin-bottom: 20px;">
            <p>Invalid email or password.</p>
        </div>
        {% endif %}

        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Email</label>
            <input type="text" name="username" class="form-control" required
                style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Password</label>
            <input type="password" name="password" class="form-control"
                style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
        </div>

        <button type="submit"
            style="width: 100%; background: #000; color: white; padding: 12px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer;">
            Sign In
        </button>
    </form>

    <div style="text-align: center; margin-top: 20px;">
        <p>New customer? <a href="{% url 'accounts:register' %}">Create Account</a></p>
    </div>
</div>
{% endblock %}
