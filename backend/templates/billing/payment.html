{% extends 'base.html' %}

{% block content %}
<div class="container" style="padding: 50px 20px; text-align: center; max-width: 600px; margin: 0 auto;">
    <h2>Confirm Payment</h2>
    <p>Order Date: {{ order.created_at|date:"M d, Y" }}</p>
    <p style="font-size: 1.5rem; color: #333; margin: 20px 0;">
        Total Amount: <span style="color: #d32f2f;">₹{{ order.total_amount }}</span>
    </p>

    <!-- Razorpay Button -->
    <button id="rzp-button1" class="btn-primary"
        style="padding: 15px 30px; font-size: 1.2rem; background: #3399cc; border: none; color: white; border-radius: 5px; cursor: pointer;">
        Pay Now
    </button>

    <div style="margin-top: 20px;">
        <a href="{% url 'cart:detail' %}" style="color: #777;">Cancel and Return to Cart</a>
    </div>

</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
    var options = {
        "key": "{{ razorpay_key_id }}", // Enter the Key ID generated from the Dashboard
        "amount": "{{ amount }}", // Amount is in currency subunits. Default currency is INR. Hence, 50000 refers to 50000 paise
        "currency": "{{ currency }}",
        "name": "Prime Optical",
        "description": "Payment for Order #{{ order.id }}",
        "image": "https://example.com/your_logo",
        "order_id": "{{ razorpay_order_id }}", //This is a sample Order ID. Pass the `id` obtained in the response of Step 1
        "callback_url": "{{ callback_url }}",
        "prefill": {
            "name": "{{ order.full_name }}",
            "email": "{{ order.email }}",
            "contact": "{{ order.phone_number }}"
        },
        "notes": {
            "address": "{{ order.address_line_1 }}"
        },
        "theme": {
            "color": "#3399cc"
        }
    };
    var rzp1 = new Razorpay(options);
    document.getElementById('rzp-button1').onclick = function (e) {
        rzp1.open();
        e.preventDefault();
    }
</script>
{% endblock %}
