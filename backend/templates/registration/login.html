{% extends 'base.html' %}

{% block content %}
<div class="container" style="max-width:400px;margin:50px auto;padding:20px;border:1px solid #ddd;border-radius:8px;">
  <h2>Login</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div>
      <label for="{{ form.username.id_for_label }}">{{ form.username.label }}</label>
      {{ form.username }}
    </div>
    <div>
      <label for="{{ form.password.id_for_label }}">{{ form.password.label }}</label>
      {{ form.password }}
    </div>
    <button type="submit" style="width:100%;padding:10px;margin-top:15px;background:#007bff;color:#fff;border:none;border-radius:4px;">Login</button>
  </form>
  <p style="margin-top:15px;">Don't have an account? <a href="{% url 'accounts:signup' %}">Sign up</a></p>
</div>
{% endblock %}
